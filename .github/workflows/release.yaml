name: Build Binaries

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: voxel_native_windows_x86_64.dll
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: libvoxel_native_linux_x86_64.so
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: libvoxel_native_macos_x86_64.dylib

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Dynamic Library
        run: cargo build --release --target ${{ matrix.target }} --manifest-path addons/VoxelDestruction/Rust/voxel_native/Cargo.toml

      # Prepare target binary
      - name: Rename Output
        shell: bash
        run: |
          # Variable pointing to subfolder target directory
          BUILD_DIR="addons/VoxelDestruction/Rust/voxel_native/target/${{ matrix.target }}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BUILD_DIR/voxel_native.dll" "${{ matrix.asset_name }}"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp "$BUILD_DIR/libvoxel_native.dylib" "${{ matrix.asset_name }}"
          else
            cp "$BUILD_DIR/libvoxel_native.so" "${{ matrix.asset_name }}"
          fi

      # Upload binary as an Artifact (For manual testing in Actions tab)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      # Attach to GitHub Release when a tag is published
      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset_name }}" --clobber