name: Build Binaries

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: my_addon_windows_x86_64.dll
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: libmy_addon_linux_x86_64.so
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: libmy_addon_macos_x86_64.dylib

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Dynamic Library
        run: cargo build --release --target ${{ matrix.target }}

      # Prepare target binary
      - name: Rename Output
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/my_addon.dll" "${{ matrix.asset_name }}"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp "target/${{ matrix.target }}/release/libmy_addon.dylib" "${{ matrix.asset_name }}"
          else
            cp "target/${{ matrix.target }}/release/libmy_addon.so" "${{ matrix.asset_name }}"
          fi

      # Upload binary as a Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      # Attach to GitHub Release on release
      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset_name }}" --clobber