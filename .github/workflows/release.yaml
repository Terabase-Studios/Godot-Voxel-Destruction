name: Build Binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: voxel_native.dll
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: libvoxel_native.so
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: libvoxel_native.dylib

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rust-std

      - name: Add macOS ARM64 Target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: addons/VoxelDestruction/Rust/voxel_native
          cache-on-failure: true

      - name: Install mold (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Build Dynamic Library
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: >-
            ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
            ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          MANIFEST="addons/VoxelDestruction/Rust/voxel_native/Cargo.toml"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # Build for both Intel and Apple Silicon
            cargo build --release --target x86_64-apple-darwin --manifest-path "$MANIFEST"
            cargo build --release --target aarch64-apple-darwin --manifest-path "$MANIFEST"

            # Combine both into a universal dynamic library
            lipo -create \
              "addons/VoxelDestruction/Rust/voxel_native/target/x86_64-apple-darwin/release/libvoxel_native.dylib" \
              "addons/VoxelDestruction/Rust/voxel_native/target/aarch64-apple-darwin/release/libvoxel_native.dylib" \
              -output "${{ matrix.asset_name }}"

            # Ad-hoc sign the library (Required for ARM64 Macs)
            codesign --force --deep --sign - "${{ matrix.asset_name }}"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            cargo build --release --target ${{ matrix.target }} --manifest-path "$MANIFEST"
            cp "addons/VoxelDestruction/Rust/voxel_native/target/${{ matrix.target }}/release/voxel_native.dll" "${{ matrix.asset_name }}"

          else
            cargo build --release --target ${{ matrix.target }} --manifest-path "$MANIFEST"
            cp "addons/VoxelDestruction/Rust/voxel_native/target/${{ matrix.target }}/release/libvoxel_native.so" "${{ matrix.asset_name }}"
          fi

      # Upload binary as an Artifact (For manual testing in Actions tab)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      # Attach to GitHub Release when a tag is published
      - name: Attach to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset_name }}" --clobber
